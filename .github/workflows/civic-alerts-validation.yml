# Workflow temporaire : valide le scraping reel sur un runner GitHub (qui a un
# acces internet complet) avant de se fier au job quotidien. A supprimer une
# fois la validation faite.
name: Validation scraping (temporaire)

on:
  push:
    branches:
      - claude/honda-civic-marketplace-alerts-pjgg6d

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r civic_alerts/requirements.txt
      - run: python tests/test_civic_alerts.py
      - name: Recherche reelle en dry-run
        run: python -m civic_alerts.main --dry-run --no-state --verbose
